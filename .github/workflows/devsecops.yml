name: DevSecOps pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  ci_secret_scan:
    name: ci / Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci_lint:
    name: ci / Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npx eslint . --ext .js --max-warnings 0

  build_package:
    name: build / Build & Package
    runs-on: ubuntu-latest
    needs: [ci_secret_scan, ci_lint]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/wanderlust-test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install and run tests (backend)
        working-directory: backend
        run: |
          npm ci
          npm run test:ci

      - name: Build frontend (production)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build_container_scan:
    name: build / Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build_package
    continue-on-error: true
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  build_and_push:
    name: build / Build & Push Docker images
    runs-on: ubuntu-latest
    needs: build_container_scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image (sha)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}

      - name: Build & push frontend image (sha)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}

      - name: Push 'latest' tags
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest

      - name: Set image tag output
        id: set_tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

  ci_sonar:
    name: ci / SonarCloud
    runs-on: ubuntu-latest
    needs: build_package
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Sonar token
        id: sonar-token-check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "run_sonar=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set — skipping SonarCloud scan."
          else
            echo "run_sonar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.sonar-token-check.outputs.run_sonar == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan
        if: steps.sonar-token-check.outputs.run_sonar == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar scan skipped or failed (non-blocking)
        if: always() && (steps.sonar-token-check.outputs.run_sonar != 'true' || failure())
        run: |
          echo "::warning::SonarCloud scan was skipped or failed. Update SONAR_TOKEN in repo secrets if you want results on SonarCloud."

  cd_deploy_ec2:
    name: CD - Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USERNAME }}" ]; then
            echo "One or more EC2 deploy secrets are missing (EC2_SSH_PRIVATE_KEY, EC2_HOST, EC2_USERNAME)."
            exit 1
          fi
          echo "Deploying to ${{ secrets.EC2_HOST }} as ${{ secrets.EC2_USERNAME }}"

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy files to EC2
        env:
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          PORT="${EC2_PORT:-22}"
          APP_DIR="/home/${{ secrets.EC2_USERNAME }}/wanderlust"
          ssh -i ~/.ssh/id_rsa -p "$PORT" "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" "rm -rf '${APP_DIR}' && mkdir -p '${APP_DIR}/backend' '${APP_DIR}/nginx'"
          scp -i ~/.ssh/id_rsa -P "$PORT" docker-compose.prod.yml "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/"
          scp -i ~/.ssh/id_rsa -P "$PORT" backend/.env.docker "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/backend/"
          scp -i ~/.ssh/id_rsa -P "$PORT" -r nginx "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USER,IMAGE_TAG
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/wanderlust
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            sudo -E docker compose -f docker-compose.prod.yml pull
            sudo -E docker compose -f docker-compose.prod.yml up -d
            sudo docker compose -f docker-compose.prod.yml ps

  cd_owasp_zap:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: cd_deploy_ec2
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "http://${{ secrets.EC2_HOST }}"
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html

