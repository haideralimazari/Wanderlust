version: "3.8"
services:
  backend:
    image: ${DOCKERHUB_USER:-youruser}/wanderlust-backend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production

  frontend:
    image: ${DOCKERHUB_USER:-youruser}/wanderlust-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
